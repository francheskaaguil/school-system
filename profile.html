<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Profile</title>
</head>

<body class="dashboard-page">

    <aside class="sidebar">
        <img src="2.webp" class="logo" width="100" height="100" alt="Logo">
        <h2>School System</h2>
        <div id="navStatus" class="nav-status">Status: Loading...</div>

        <a id="dashboardLink" href="StudentDashboard.html">Dashboard</a>
        <a href="Subjects.html">Subjects</a>
        <a id="attendanceLink" href="Attendance.html">Attendance</a>
        <a id="recordsLink" href="Records.html" hidden>Grades & Announcements</a>
        <a class="active" href="profile.html"> My Profile</a>
        <a href="#" onclick="logout()">Logout</a>

    </aside>

    <main class="dashboard">

        <h1>My Profile</h1>

        <section class="card">

            <img id="profilePicture" src="2.webp" class="profile-picture" width="100" height="100" alt="Profile picture">

            <div>
                <h2 id="fullName">Loading...</h2>
                <p id="roleLabel">School System User</p>
                <span id="accountBadge" class="status-badge status-active">Active</span>
            </div>

        </section>

        <section class="info-card profile-completion" aria-labelledby="completionTitle">
            <div class="completion-heading">
                <div>
                    <h2 id="completionTitle">Profile completeness</h2>
                    <p id="completionMessage">Loading profile details...</p>
                </div>
                <strong id="completionValue">0%</strong>
            </div>
            <progress id="completionProgress" max="100" value="0" aria-label="Profile completeness">0%</progress>
        </section>

        <section class="info-card">

            <div class="info-header">

                <h2>Personal Information</h2>

                <button id="editButton" class="edit-button" type="button" onclick="editProfile()" disabled>
                    Edit Profile
                </button>

            </div>

            <div id="personalInfo"></div>
            <p id="profileMessage" class="profile-message" role="status" aria-live="polite" hidden></p>

        </section>

    </main>

    <script>

        const savedUser = JSON.parse(
            localStorage.getItem("user")
        );

        let currentUser;

        if (!savedUser) location.href = "index.html";

        function setProfileMessage(message, state = "") {
            const element = document.getElementById("profileMessage");
            element.textContent = message;
            element.className = `profile-message ${state}`;
            element.hidden = !message;
        }

        async function loadProfile() {

            try {

                const response = await fetch(
                    `/api/profile?email=${encodeURIComponent(savedUser.email)}`
                );

                const result = await response.json();

                if (!response.ok || !result.success) {
                    setProfileMessage(result.message || "Unable to load your profile.", "error");
                    return;
                }

                currentUser = result.user;
                showProfile();

            } catch (error) {

                setProfileMessage("Cannot connect to the server. Please try again.", "error");
                console.error("Unable to load profile:", error);

            }
        }

        function showProfile() {

            document.getElementById("fullName").textContent =
                `${currentUser.firstName} ${currentUser.lastName}`;
            document.getElementById("profilePicture").src = currentUser.profilePicture || "gela.jpeg";
            document.getElementById("roleLabel").textContent =
                `${currentUser.role.charAt(0).toUpperCase()}${currentUser.role.slice(1)} Account`;
            document.getElementById("editButton").disabled = false;

            const accountStatus = currentUser.accountStatus || "Active";
            const accountBadge = document.getElementById("accountBadge");
            accountBadge.textContent = accountStatus;
            accountBadge.className = `status-badge ${accountStatus === "Active" ? "status-active" : "status-inactive"}`;

            const fields = [
                ["First Name", currentUser.firstName],
                ["Last Name", currentUser.lastName],
                ["Email", currentUser.email],
                ["Date of Birth", currentUser.dateOfBirth],
                ["Phone", currentUser.phone],
                ["Gender", currentUser.gender],
                ["Address", currentUser.address]
            ];

            document.getElementById("personalInfo").innerHTML = fields.map(([label, value]) =>
                `<p><b>${label}:</b> ${escapeHtml(value)}</p>`
            ).join("");

            updateProfileCompletion();
        }

        function updateProfileCompletion() {
            const fields = [
                ["First name", currentUser.firstName],
                ["Last name", currentUser.lastName],
                ["Email", currentUser.email],
                ["Date of birth", currentUser.dateOfBirth],
                ["Phone", currentUser.phone],
                ["Gender", currentUser.gender],
                ["Address", currentUser.address]
            ];
            const completed = fields.filter(([, value]) => String(value ?? "").trim()).length;
            const percentage = Math.round((completed / fields.length) * 100);
            const missing = fields.filter(([, value]) => !String(value ?? "").trim()).map(([label]) => label);

            document.getElementById("completionProgress").value = percentage;
            document.getElementById("completionProgress").setAttribute("aria-label", `Profile completeness: ${percentage}%`);
            document.getElementById("completionValue").textContent = `${percentage}%`;
            document.getElementById("completionMessage").textContent = missing.length
                ? `Add ${missing.join(", ")} to complete your profile.`
                : "Your profile is complete.";
        }

        function editProfile() {
            setProfileMessage("");
            const maxDate = new Date();
            maxDate.setMinutes(maxDate.getMinutes() - maxDate.getTimezoneOffset());
            const today = maxDate.toISOString().slice(0, 10);

            document.getElementById("personalInfo").innerHTML = `
                <form id="profileForm" class="profile-form">
                    <div><label for="firstName">First Name</label><input id="firstName" name="firstName" autocomplete="given-name" value="${escapeHtml(currentUser.firstName)}" required></div>
                    <div><label for="lastName">Last Name</label><input id="lastName" name="lastName" autocomplete="family-name" value="${escapeHtml(currentUser.lastName)}" required></div>
                    <div><label for="email">Email</label><input id="email" value="${escapeHtml(currentUser.email)}" disabled></div>
                    <div><label for="dateOfBirth">Date of Birth</label><input id="dateOfBirth" name="dateOfBirth" type="date" max="${today}" value="${escapeHtml(currentUser.dateOfBirth)}" required></div>
                    <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" value="${escapeHtml(currentUser.phone)}" required></div>
                    <div><label for="gender">Gender</label><input id="gender" name="gender" value="${escapeHtml(currentUser.gender)}" required></div>
                    <div class="full-width"><label for="address">Address</label><input id="address" name="address" autocomplete="street-address" value="${escapeHtml(currentUser.address)}" required></div>
                    <div class="form-actions"><button id="saveButton" class="save-button" type="submit">Save changes</button><button class="cancel-button" type="button" onclick="cancelEdit()">Cancel</button></div>
                </form>`;

            document.getElementById("profileForm").addEventListener("submit", saveProfile);
        }

        function cancelEdit() {
            showProfile();
        }

        async function saveProfile(event) {
            event.preventDefault();
            const saveButton = document.getElementById("saveButton");
            saveButton.disabled = true;
            saveButton.textContent = "Saving...";

            const data = {
                email: currentUser.email,
                firstName: document.getElementById("firstName").value,
                lastName: document.getElementById("lastName").value,
                dateOfBirth: document.getElementById("dateOfBirth").value,
                phone: document.getElementById("phone").value,
                gender: document.getElementById("gender").value,
                address: document.getElementById("address").value
            };

            try {

                const response = await fetch("/api/profile", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    setProfileMessage(result.message || "Unable to save your profile.", "error");
                    return;
                }

                currentUser = {
                    ...currentUser,
                    ...data
                };

                localStorage.setItem(
                    "user",
                    JSON.stringify(currentUser)
                );

                showProfile();
                setProfileMessage("Your profile has been updated.", "success");

            } catch (error) {

                setProfileMessage("Cannot connect to the server. Your changes were not saved.", "error");
                console.error("Unable to save profile:", error);

            } finally {
                const button = document.getElementById("saveButton");
                if (button) {
                    button.disabled = false;
                    button.textContent = "Save changes";
                }

            }
        }

        function logout() {
            localStorage.removeItem("user");
            location.href = "index.html";
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>'"]/g, character => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
            })[character]);
        }

        if (savedUser) {
            const dashboards = {
                student: "StudentDashboard.html",
                staff: "StaffDashboard.html",
                admin: "AdminDashboard.html"
            };
            const navStatus = document.getElementById("navStatus");
            const accountStatus = savedUser.accountStatus || "Active";
            navStatus.textContent = `Status: ${accountStatus}`;
            navStatus.classList.add(accountStatus === "Active" ? "active" : "inactive");
            document.getElementById("dashboardLink").href = dashboards[savedUser.role] || "StudentDashboard.html";
            document.getElementById("attendanceLink").hidden = false;
            document.getElementById("recordsLink").hidden = !["staff", "admin"].includes(savedUser.role);
            loadProfile();
        }

    </script>

</body>
</html>
